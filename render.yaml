services:
  # 1. Backend REST API & WebSocket Gateway (Node.js Service)
  - type: web
    name: prana-yoga-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Paste your Supabase connection string here in Render Dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 2. Frontend Client Web App (Static Site)
  - type: static
    name: prana-yoga-web
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: prana-yoga-api
          property: host
