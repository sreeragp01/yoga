services:
  # 1. Backend REST API & WebSocket Gateway (Node.js Service)
  - type: web
    name: yoga-api-sreerag01
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase connection string
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 2. Frontend Client Web App (Static Site)
  - type: web
    name: yoga-web-sreerag01
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
